[project]
name = "discovery-market"
version = "0.1.0"
description = "Discovery Market: a simulated prize market for AI scientific-discovery agents"
readme = "STATUS.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "numpy>=1.26",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
