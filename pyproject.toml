[project]
name = "discovery-market"
version = "0.1.0"
description = "Discovery Market: a simulated prize market for AI scientific-discovery agents"
readme = "STATUS.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    # DiscoverPhysics (vendor/discovery-agents, pinned submodule)
    "physchool",
    "scienceagent",
    "requests>=2.31",  # imported by scienceagent.llm_client but not declared
    "huggingface-hub>=1.0,<2",
]

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.uv.sources]
physchool = { path = "vendor/discovery-agents/PhysicsSchool", editable = true }
scienceagent = { path = "vendor/discovery-agents/ScienceAgent", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
