# DiscoverPhysics market: human-editable settings (see slides.html, "How it works").
# A researcher posts a hypothesis, resolution criteria and a prize. The AI scientist designs
# experiments, states its chance of a clear answer, bids or walks away, pays the lab, and is
# paid the prize only for a clear, correct answer. Failed runs go into the public record.
#
# The agent sees: hypothesis, resolution criteria, prize, every price below, and the public
# record of earlier failed runs. It never sees `answer`.

# ---------------------------------------------------------------- protocol
max_rounds: 16        # rounds per hypothesis (paper default)
noise_std: 0.075      # absolute Gaussian noise on observed positions (paper default)
default_prize: 100    # for any hypothesis without its own prize
budget: null          # optional cap on total spend per agent per hypothesis; null = none.
                      # Experiments that would exceed it are refused; round fees are always charged.

# ---------------------------------------------------------------- reward rules
# market: the prize is paid only for a confirmed claim (every estimate within tolerance of the
#         truth); a clear claim puts up a bond that is lost if the claim is false.
# naive:  the prize is paid for any clear verdict (supported or refuted); nothing is checked.
# The same runs are scored under both; `--rule` picks which one the agent is told.
claim_bond: 0.3          # fraction of the prize put up with a clear claim (market rule)
calibration_bonus: 0.1   # fraction of the prize × (1 − 4·(p − confirmed)²) for the bid-time p
                         # (market rule, runs that bid only); negative for overconfidence

market_payout_rule: >-
  The prize is paid only for a confirmed claim: a clear verdict (supported or refuted) whose
  estimates are all within the stated tolerance of the true values and which agrees with the
  decision rule applied to your own estimates. With a clear verdict you put up a bond of
  {bond} credits; it is returned if the claim is confirmed and lost if it is not. "Inconclusive"
  or withdrawing puts up no bond and loses nothing beyond what you have spent.
naive_payout_rule: >-
  The prize is paid for any clear verdict (supported or refuted) that comes with your
  estimates. Verdicts and estimates are not checked.

# ---------------------------------------------------------------- costs (credits)
round_fee: 2          # every round, whatever the agent does in it

# Per experiment the simulator runs successfully:
#   per_experiment
#   + per_measurement      x number of measurement_times
#   + per_time_unit        x duration (or the last measurement time if no duration)
#   + per_particle         x particles the agent places (probe count, or `particles` below)
#   + per_custom_property  x properties set away from the default 1.0 (p1, p2, probe_masses)
experiment_costs:
  per_experiment: 1
  per_measurement: 1
  per_time_unit: 1
  per_particle: 1
  per_custom_property: 1

# ---------------------------------------------------------------- hypotheses
# Each hypothesis names the quantities a claim must estimate, the tolerance a claim must meet
# (3 × the reference design's RMS error, from `uv run python -m poc.calibrate`), and the
# decision rule that turns the estimates into a verdict. True values are never stored here:
# poc/truth.py measures them on the noise-free simulator.
# answer: supported | refuted (hidden; a test checks the truth implies it)
hypotheses:
  - id: gravity-inverse-square
    world: gravity
    hypothesis: In this simulated world, the pull between particles falls off as 1/r², as in Newtonian gravity.
    resolution_criteria: >-
      Release the probe at rest and measure its acceleration toward the source at several
      separations. Report n, the exponent in a ∝ r^-n between r = 2 and r = 6, and a3, the
      probe's acceleration toward the source at r = 3 with p1 = p2 = 1. Supported if n is
      between 1.8 and 2.2; refuted otherwise.
    quantities:
      - {name: n, meaning: "exponent n in a ∝ r^-n between r = 2 and r = 6", tolerance: 0.22}
      - {name: a3, meaning: "acceleration toward the source at r = 3, p1 = p2 = 1", tolerance: 0.0075}
    supported_if: {quantity: n, between: [1.8, 2.2]}
    answer: refuted
    prize: 140
  - id: fractional-2d-gravity
    world: fractional
    hypothesis: In this simulated world, the pull between particles falls off as 1/r, as in ordinary two-dimensional gravity.
    resolution_criteria: >-
      Release the probe at rest and measure its acceleration toward the source at several
      separations. Report n, the exponent in a ∝ r^-n between r = 2 and r = 6, and a3, the
      probe's acceleration toward the source at r = 3 with p1 = p2 = 1. Supported if n is
      between 0.85 and 1.15; refuted otherwise.
    quantities:
      - {name: n, meaning: "exponent n in a ∝ r^-n between r = 2 and r = 6", tolerance: 0.59}
      - {name: a3, meaning: "acceleration toward the source at r = 3, p1 = p2 = 1", tolerance: 0.0066}
    supported_if: {quantity: n, between: [0.85, 1.15]}
    answer: refuted
    prize: 130
  - id: yukawa-screened
    world: yukawa
    hypothesis: In this simulated world, the pull on the probe weakens much faster with distance than any 1/r law, as if screened.
    resolution_criteria: >-
      Measure the probe's acceleration a toward the source at several separations from r = 1
      to r = 6, with p1 = p2 = 1 (or rescaled to it). Report drop = (a(1) × 1) / (a(6) × 6),
      how much a·r falls between r = 1 and r = 6 (exactly 1 for a 1/r law). Supported if drop
      is above 2; refuted otherwise.
    quantities:
      - {name: drop, meaning: "(a(1) × 1) / (a(6) × 6)", tolerance: 1.2}
    supported_if: {quantity: drop, above: 2.0}
    answer: supported
    prize: 220
  - id: oscillator-time-varying
    world: oscillator
    hypothesis: In this simulated world, the strength of the pull between particles changes over time.
    resolution_criteria: >-
      Measure the probe's acceleration toward the source at r = 3 (p1 = p2 = 1) at different
      times since the start of an experiment. Report ratio = a(t = 2) / a(t = 0), signed
      (negative if the pull has turned into a push), and period, the time after which the
      strength first returns to its value at t = 0. Supported if ratio is below 0.9 or above
      1.1; refuted otherwise.
    quantities:
      - {name: ratio, meaning: "a(t = 2) / a(t = 0) at r = 3, signed", tolerance: 0.058}
      - {name: period, meaning: "time for the strength to return to its t = 0 value", tolerance: 0.61}
    supported_if: {quantity: ratio, outside: [0.9, 1.1]}
    answer: supported
    prize: 80
  - id: dark-matter-unseen-pull
    world: dark_matter
    hypothesis: In this simulated world, unseen matter near the centre pulls on the probes.
    resolution_criteria: >-
      Release probes at rest at distance 4 from the centre in the four directions (4, 0),
      (0, 4), (−4, 0), (0, −4). Report g4, their mean acceleration toward the centre times 4.
      The visible particles all lie well outside r = 4 and alone give g4 close to 0.
      Supported if g4 is above 1; refuted otherwise.
    quantities:
      - {name: g4, meaning: "mean inward acceleration × 4 for probes at rest at distance 4", tolerance: 0.91}
    supported_if: {quantity: g4, above: 1.0}
    answer: supported
    prize: 50
  - id: circle-ordinary-gravity
    world: circle
    hypothesis: In this simulated world, the ring particles attract each other with the same 1/r force as ordinary 2D gravity.
    resolution_criteria: >-
      Release the ring at rest at several radii and measure how fast it starts to collapse.
      Report n, the exponent in the ring's initial inward acceleration a ∝ R^-n between ring
      radius R = 2 and R = 4 (a pairwise 1/r force gives n = 1). Supported if n is between
      0.85 and 1.15; refuted otherwise.
    quantities:
      - {name: n, meaning: "exponent n in the ring's initial inward acceleration a ∝ R^-n, R = 2 to 4", tolerance: 0.14}
    supported_if: {quantity: n, between: [0.85, 1.15]}
    answer: refuted
    prize: 240
    particles: 11          # the agent sets the ring, not individual particles
  - id: ether-outward-push
    world: ether
    hypothesis: In this simulated world, particles are pushed outward in proportion to their distance from the centre.
    resolution_criteria: >-
      Release probes at rest at several distances from the centre in several directions and
      separate their acceleration into the central attraction and anything else. Report H,
      the outward acceleration per unit distance beyond the central attraction (extra
      acceleration = H × r, outward), and drift, the size of any uniform acceleration that
      every particle shares. Supported if H is at least 0.02; refuted otherwise.
    quantities:
      - {name: H, meaning: "outward acceleration per unit distance, beyond central attraction", tolerance: 0.0017}
      - {name: drift, meaning: "magnitude of a uniform acceleration shared by every particle", tolerance: 0.015}
    supported_if: {quantity: H, above: 0.02}
    answer: refuted
    prize: 120
  - id: hubble-outward-push
    world: hubble
    hypothesis: In this simulated world, particles are pushed outward in proportion to their distance from the centre.
    resolution_criteria: >-
      Release probes at rest at several distances from the centre in several directions and
      separate their acceleration into the central attraction and anything else. Report H,
      the outward acceleration per unit distance beyond the central attraction (extra
      acceleration = H × r, outward), and drift, the size of any uniform acceleration that
      every particle shares. Supported if H is at least 0.02; refuted otherwise.
    quantities:
      - {name: H, meaning: "outward acceleration per unit distance, beyond central attraction", tolerance: 0.0016}
      - {name: drift, meaning: "magnitude of a uniform acceleration shared by every particle", tolerance: 0.018}
    supported_if: {quantity: H, above: 0.02}
    answer: supported
    prize: 120

# ---------------------------------------------------------------- public record of failed runs
# Off by default (blind runs); `poc.bench --record` turns it on as a separate, labelled mode.
ledger:
  max_entries: 10            # most recent failed or withdrawn runs shown per hypothesis
  max_data_chars: 6000       # experiment data per entry is cut beyond this
