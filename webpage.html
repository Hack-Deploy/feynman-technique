  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

=\"5\" y=\"4\" width=\"14\" height=\"17\" rx=\"1.5\"><\u002Frect><path d=\"M9 4V3h6v1\"><\u002Fpath><path d=\"M8 10h8\"><\u002Fpath><path d=\"M8 14h8\"><\u002Fpath><path d=\"M8 18h5\"><\u002Fpath><\u002Fsvg><div style=\"font-weight: 600\">Experiment Design<\u002Fdiv><\u002Fdiv>\n<div style=\"border: 1.5px solid #111111; padding: 20px 10px\"><svg width=\"40\" height=\"40\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1B3F8B\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 3h6\"><\u002Fpath><path d=\"M10 3v6l-5 9a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3l-5-9V3\"><\u002Fpath><path d=\"M7.5 15h9\"><\u002Fpath><\u002Fsvg><div style=\"font-weight: 600\">Lab Execution<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"display: flex; flex-direction: column; gap: 20px\">\n<div style=\"display: flex; gap: 16px; align-items: center\"><span style=\"font-family: 'Source Serif 4', Georgia, serif; font-size: 44px; color: #1B3F8B; line-height: 1\">1<\u002Fspan><h2 style=\"margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 32px; font-weight: 600\">Post a hypothesis and a prize<\u002Fh2><\u002Fdiv>\n<p style=\"margin: 0; color: #333333\">True or false both pay. No clear answer, no payout.<\u002Fp>\n<div style=\"border: 1px solid #111111; background: #FFFFFF; padding: 20px; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"display: flex; justify-content: space-between; gap: 16px; align-items: baseline; flex-wrap: wrap\">\n<span style=\"font-family: 'Source Serif 4', Georgia, serif; font-size: 24px\">“Gravity makes objects fall to the ground.”<\u002Fspan>\n<span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 22px\">£50<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); text-align: center; border: 1px solid #111111; font-weight: 600\">\n<div style=\"padding: 12px; background: #1B3F8B; color: #FFFFFF\">True → paid<\u002Fdiv>\n<div style=\"padding: 12px; background: #1B3F8B; color: #FFFFFF; border-left: 1px solid #FFFFFF\">False → paid<\u002Fdiv>\n<div style=\"padding: 12px; background: #F2F2EE; color: #4A4A4A; border-left: 1px solid #111111\">No answer → not paid<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin: 0; padding: 12px 16px; border-left: 3px solid #1B3F8B; background: #EEF2F9\">University researchers: your grant money is only spent when it buys an answer.<\u002Fp>\n<\u002Fsection>\n\n<section style=\"display: flex; flex-direction: column; gap: 20px\">\n<div style=\"display: flex; gap: 16px; align-items: center\"><span style=\"font-family: 'Source Serif 4', Georgia, serif; font-size: 44px; color: #1B3F8B; line-height: 1\">2<\u002Fspan><h2 style=\"margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 32px; font-weight: 600\">Design the experiment, or walk away<\u002Fh2><\u002Fdiv>\n<div style=\"border: 1px solid #111111; background: #FFFFFF; padding: 20px; display: flex; flex-direction: column; gap: 6px\">\n<span style=\"font-family: 'Source Serif 4', Georgia, serif; font-size: 22px\">Climb a ladder, drop an apple, record where it lands.<\u002Fspan>\n<\u002Fdiv>\n<figure style=\"margin: 0; display: flex; flex-direction: column; gap: 6px\">\n<svg sc-camel-view-box=\"0 0 860 210\" role=\"img\" aria-label=\"The designer is about 95% sure of a clear answer; it only needs 8% to cover the cost\" style=\"width: 100%; height: auto; font-family: 'Source Sans 3', sans-serif\">\n<path d=\"M676,150 L676.0,149.9 678.0,149.9 680.1,149.9 682.1,149.8 684.2,149.8 686.2,149.8 688.3,149.8 690.4,149.7 692.4,149.7 694.5,149.6 696.5,149.6 698.5,149.5 700.6,149.4 702.6,149.4 704.7,149.3 706.8,149.2 708.8,149.0 710.9,148.9 712.9,148.7 715.0,148.5 717.0,148.3 719.1,148.1 721.1,147.8 723.1,147.6 725.2,147.2 727.2,146.8 729.3,146.4 731.4,146.0 733.4,145.4 735.5,144.8 737.5,144.2 739.6,143.4 741.6,142.6 743.7,141.7 745.7,140.7 747.8,139.5 749.8,138.3 751.9,136.9 753.9,135.4 756.0,133.7 758.0,131.9 760.1,129.9 762.1,127.7 764.2,125.4 766.2,122.8 768.3,120.0 770.3,117.0 772.4,113.8 774.4,110.4 776.5,106.7 778.5,102.8 780.5,98.7 782.6,94.4 784.7,89.9 786.7,85.3 788.8,80.5 790.8,75.7 792.9,70.8 794.9,65.9 797.0,61.2 799.0,56.6 801.0,52.4 803.1,48.5 805.1,45.2 807.2,42.6 809.2,40.8 811.3,40.0 813.4,40.4 815.4,42.1 817.5,45.2 819.5,50.0 821.6,56.5 823.6,64.8 825.6,74.8 827.7,86.3 829.8,99.0 831.8,112.4 833.9,125.6 835.9,137.5 838.0,146.4 840,150 Z\" fill=\"#C9D3E6\" stroke=\"#1B3F8B\" stroke-width=\"2\"><\u002Fpath>\n<line x1=\"20\" y1=\"150\" x2=\"840\" y2=\"150\" stroke=\"#111111\"><\u002Fline>\n<g font-size=\"14\" fill=\"#4A4A4A\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\"><text x=\"20\" y=\"174\">0%<\u002Ftext><text x=\"430\" y=\"174\">50%<\u002Ftext><text x=\"840\" y=\"174\">100%<\u002Ftext><\u002Fg>\n<text x=\"430\" y=\"200\" font-size=\"15\" text-anchor=\"middle\" fill=\"#111111\">Chance of a clear answer<\u002Ftext>\n<line x1=\"85.6\" y1=\"40\" x2=\"85.6\" y2=\"150\" stroke=\"#A23B1E\" stroke-width=\"2\" stroke-dasharray=\"5 4\"><\u002Fline>\n<text x=\"96\" y=\"60\" font-size=\"16\" fill=\"#A23B1E\">needs 8% to break even<\u002Ftext>\n<text x=\"660\" y=\"60\" font-size=\"16\" text-anchor=\"end\" font-weight=\"600\" fill=\"#1B3F8B\">designer's confidence: ~95%<\u002Ftext>\n<\u002Fsvg>\n<figcaption style=\"font-size: 16px; color: #333333\">Confident enough to cover the cost → <span style=\"font-weight: 600; color: #1B3F8B\">bid<\u002Fspan>. Not confident enough → walk away.<\u002Ffigcaption>\n<\u002Ffigure>\n<\u002Fsection>\n\n<section style=\"display: flex; flex-direction: column; gap: 20px\">\n<div style=\"display: flex; gap: 16px; align-items: center\"><span style=\"font-family: 'Source Serif 4', Georgia, serif; font-size: 44px; color: #1B3F8B; line-height: 1\">3<\u002Fspan><h2 style=\"margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 32px; font-weight: 600\">Run it in a lab<\u002Fh2><\u002Fdiv>\n<p style=\"margin: 0; color: #333333\">Labs publish prices. The run is safety-checked and paid upfront.<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px\">\n<div style=\"display: flex; align-items: center; gap: 12px; border: 1px solid #D9D9D4; background: #FFFFFF; padding: 14px\"><svg width=\"36\" height=\"36\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1B3F8B\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3v18\"><\u002Fpath><path d=\"M17 3v18\"><\u002Fpath><path d=\"M7 7h10\"><\u002Fpath><path d=\"M7 11h10\"><\u002Fpath><path d=\"M7 15h10\"><\u002Fpath><path d=\"M7 19h10\"><\u002Fpath><\u002Fsvg><div style=\"display: flex; flex-direction: column\"><span style=\"font-weight: 600\">Ladder<\u002Fspan><span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 16px\">£0.50<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 12px; border: 1px solid #D9D9D4; background: #FFFFFF; padding: 14px\"><svg width=\"36\" height=\"36\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1B3F8B\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 7.5c-1.5-1-5.2-1.3-6.2 2.2-1 3.6 1 9.3 3.4 9.8 1.2.3 1.8-.4 2.8-.4s1.6.7 2.8.4c2.4-.5 4.4-6.2 3.4-9.8-1-3.5-4.7-3.2-6.2-2.2z\"><\u002Fpath><path d=\"M12 7.5V5\"><\u002Fpath><path d=\"M12 5.5c.8-1.6 2.3-2.4 4-2.5\"><\u002Fpath><\u002Fsvg><div style=\"display: flex; flex-direction: column\"><span style=\"font-weight: 600\">Apple<\u002Fspan><span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 16px\">£0.50<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 12px; border: 1px solid #D9D9D4; background: #FFFFFF; padding: 14px\"><svg width=\"36\" height=\"36\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1B3F8B\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"6\" r=\"3\"><\u002Fcircle><path d=\"M5 21v-3a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v3\"><\u002Fpath><path d=\"M12 13v8\"><\u002Fpath><path d=\"M9.5 13l2.5 4 2.5-4\"><\u002Fpath><\u002Fsvg><div style=\"display: flex; flex-direction: column\"><span style=\"font-weight: 600\">Technician, 15 min<\u002Fspan><span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 16px\">£3.00<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 24px; flex-wrap: wrap; align-items: center\"><span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 500\">Total £4.00<\u002Fspan><span style=\"display: inline-flex; align-items: center; gap: 8px; color: #1B3F8B; font-weight: 600\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1B3F8B\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l7 3v5c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V6z\"><\u002Fpath><path d=\"M9 12l2 2 4-4\"><\u002Fpath><\u002Fsvg>Safety check passed<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"display: flex; flex-direction: column; gap: 20px\">\n<div style=\"display: flex; gap: 16px; align-items: center\"><span style=\"font-family: 'Source Serif 4', Georgia, serif; font-size: 44px; color: #1B3F8B; line-height: 1\">4<\u002Fspan><h2 style=\"margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 32px; font-weight: 600\">The result pays out<\u002Fh2><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px\">\n<div style=\"border: 1.5px solid #1B3F8B; background: #EEF2F9; padding: 20px; display: flex; flex-direction: column; gap: 4px\"><span style=\"font-weight: 600\">Apple hits the ground<\u002Fspan><span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 26px; color: #1B3F8B\">+£46<\u002Fspan><span style=\"font-size: 15px; color: #4A4A4A\">£50 prize − £4 cost<\u002Fspan><\u002Fdiv>\n<div style=\"border: 1.5px solid #8A8A85; padding: 20px; display: flex; flex-direction: column; gap: 4px\"><span style=\"font-weight: 600\">Nobody recorded the drop<\u002Fspan><span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 26px; color: #A23B1E\">−£4<\u002Fspan><span style=\"font-size: 15px; color: #4A4A4A\">No answer, no prize<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin: 0; padding: 12px 16px; border-left: 3px solid #1B3F8B; background: #EEF2F9\">Every run is logged, including negative results, so the next experiment learns from what didn't work.<\u002Fp>\n<\u002Fsection>\n\n<section style=\"display: flex; flex-direction: column; gap: 20px\">\n<div style=\"display: flex; gap: 16px; align-items: center\"><span style=\"font-family: 'Source Serif 4', Georgia, serif; font-size: 44px; color: #1B3F8B; line-height: 1\">5<\u002Fspan><h2 style=\"margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 32px; font-weight: 600\">Everyone is scored on their predictions<\u002Fh2><\u002Fdiv>\n<p style=\"margin: 0; color: #333333\">When you say 20%, does it happen 20% of the time?<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 32px\">\n\n<figure style=\"margin: 0; display: flex; flex-direction: column; gap: 6px\">\n<span style=\"font-weight: 600\">Hypothesis: “it's true”<\u002Fspan>\n<svg sc-camel-view-box=\"0 0 400 400\" role=\"img\" aria-label=\"Institute A sits on the diagonal; Institute B says 90% but is right 45% of the time\" style=\"width: 100%; height: auto; font-family: 'Source Sans 3', sans-serif\">\n<line x1=\"50\" y1=\"350\" x2=\"370\" y2=\"30\" stroke=\"#8A8A85\" stroke-dasharray=\"4 4\"><\u002Fline>\n<line x1=\"50\" y1=\"350\" x2=\"370\" y2=\"350\" stroke=\"#111111\"><\u002Fline>\n<line x1=\"50\" y1=\"30\" x2=\"50\" y2=\"350\" stroke=\"#111111\"><\u002Fline>\n<g font-size=\"13\" fill=\"#4A4A4A\" font-family=\"IBM Plex Mono, monospace\">\n<text x=\"50\" y=\"368\" text-anchor=\"middle\">0%<\u002Ftext><text x=\"210\" y=\"368\" text-anchor=\"middle\">50%<\u002Ftext><text x=\"370\" y=\"368\" text-anchor=\"middle\">100%<\u002Ftext>\n<text x=\"42\" y=\"354\" text-anchor=\"end\">0%<\u002Ftext><text x=\"42\" y=\"194\" text-anchor=\"end\">50%<\u002Ftext><text x=\"42\" y=\"34\" text-anchor=\"end\">100%<\u002Ftext>\n<\u002Fg>\n<text x=\"210\" y=\"392\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111111\">Said<\u002Ftext>\n<text x=\"14\" y=\"190\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111111\" transform=\"rotate(-90 14 190)\">Happened<\u002Ftext>\n<polyline fill=\"none\" stroke=\"#1B3F8B\" stroke-width=\"2\" points=\"82,324.4 114,279.6 146,263.6 178,212.4 210,196.4 242,151.6 274,138.8 306,87.6 338,68.4\"><\u002Fpolyline>\n<g fill=\"#1B3F8B\"><circle cx=\"82\" cy=\"324.4\" r=\"5\"><\u002Fcircle><circle cx=\"114\" cy=\"279.6\" r=\"5\"><\u002Fcircle><circle cx=\"146\" cy=\"263.6\" r=\"5\"><\u002Fcircle><circle cx=\"178\" cy=\"212.4\" r=\"5\"><\u002Fcircle><circle cx=\"210\" cy=\"196.4\" r=\"5\"><\u002Fcircle><circle cx=\"242\" cy=\"151.6\" r=\"5\"><\u002Fcircle><circle cx=\"274\" cy=\"138.8\" r=\"5\"><\u002Fcircle><circle cx=\"306\" cy=\"87.6\" r=\"5\"><\u002Fcircle><circle cx=\"338\" cy=\"68.4\" r=\"5\"><\u002Fcircle><\u002Fg>\n<polyline fill=\"none\" stroke=\"#A23B1E\" stroke-width=\"2\" points=\"82,311.6 114,292.4 146,279.6 178,266.8 210,254 242,244.4 274,228.4 306,215.6 338,206\"><\u002Fpolyline>\n<g fill=\"#A23B1E\"><circle cx=\"82\" cy=\"311.6\" r=\"5\"><\u002Fcircle><circle cx=\"114\" cy=\"292.4\" r=\"5\"><\u002Fcircle><circle cx=\"146\" cy=\"279.6\" r=\"5\"><\u002Fcircle><circle cx=\"178\" cy=\"266.8\" r=\"5\"><\u002Fcircle><circle cx=\"210\" cy=\"254\" r=\"5\"><\u002Fcircle><circle cx=\"242\" cy=\"244.4\" r=\"5\"><\u002Fcircle><circle cx=\"274\" cy=\"228.4\" r=\"5\"><\u002Fcircle><circle cx=\"306\" cy=\"215.6\" r=\"5\"><\u002Fcircle><circle cx=\"338\" cy=\"206\" r=\"5\"><\u002Fcircle><\u002Fg>\n<text x=\"300\" y=\"58\" font-size=\"14\" font-weight=\"600\" fill=\"#1B3F8B\" text-anchor=\"end\">Institute A<\u002Ftext>\n<text x=\"350\" y=\"230\" font-size=\"14\" font-weight=\"600\" fill=\"#A23B1E\" text-anchor=\"end\">Institute B<\u002Ftext>\n<\u002Fsvg>\n<\u002Ffigure>\n\n<figure style=\"margin: 0; display: flex; flex-direction: column; gap: 6px\">\n<span style=\"font-weight: 600\">Experiment Design: “we'll get a clear answer”<\u002Fspan>\n<svg sc-camel-view-box=\"0 0 400 400\" role=\"img\" aria-label=\"AI Lab A sits on the diagonal; Startup C says 90% but succeeds 30% of the time\" style=\"width: 100%; height: auto; font-family: 'Source Sans 3', sans-serif\">\n<line x1=\"50\" y1=\"350\" x2=\"370\" y2=\"30\" stroke=\"#8A8A85\" stroke-dasharray=\"4 4\"><\u002Fline>\n<line x1=\"50\" y1=\"350\" x2=\"370\" y2=\"350\" stroke=\"#111111\"><\u002Fline>\n<line x1=\"50\" y1=\"30\" x2=\"50\" y2=\"350\" stroke=\"#111111\"><\u002Fline>\n<g font-size=\"13\" fill=\"#4A4A4A\" font-family=\"IBM Plex Mono, monospace\">\n<text x=\"50\" y=\"368\" text-anchor=\"middle\">0%<\u002Ftext><text x=\"210\" y=\"368\" text-anchor=\"middle\">50%<\u002Ftext><text x=\"370\" y=\"368\" text-anchor=\"middle\">100%<\u002Ftext>\n<text x=\"42\" y=\"354\" text-anchor=\"end\">0%<\u002Ftext><text x=\"42\" y=\"194\" text-anchor=\"end\">50%<\u002Ftext><text x=\"42\" y=\"34\" text-anchor=\"end\">100%<\u002Ftext>\n<\u002Fg>\n<text x=\"210\" y=\"392\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111111\">Said<\u002Ftext>\n<text x=\"14\" y=\"190\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111111\" transform=\"rotate(-90 14 190)\">Happened<\u002Ftext>\n<polyline fill=\"none\" stroke=\"#1B3F8B\" stroke-width=\"2\" points=\"82,311.6 114,292.4 146,244.4 178,228.4 210,183.6 242,167.6 274,122.8 306,103.6 338,74.8\"><\u002Fpolyline>\n<g fill=\"#1B3F8B\"><circle cx=\"82\" cy=\"311.6\" r=\"5\"><\u002Fcircle><circle cx=\"114\" cy=\"292.4\" r=\"5\"><\u002Fcircle><circle cx=\"146\" cy=\"244.4\" r=\"5\"><\u002Fcircle><circle cx=\"178\" cy=\"228.4\" r=\"5\"><\u002Fcircle><circle cx=\"210\" cy=\"183.6\" r=\"5\"><\u002Fcircle><circle cx=\"242\" cy=\"167.6\" r=\"5\"><\u002Fcircle><circle cx=\"274\" cy=\"122.8\" r=\"5\"><\u002Fcircle><circle cx=\"306\" cy=\"103.6\" r=\"5\"><\u002Fcircle><circle cx=\"338\" cy=\"74.8\" r=\"5\"><\u002Fcircle><\u002Fg>\n<polyline fill=\"none\" stroke=\"#A23B1E\" stroke-width=\"2\" points=\"82,334 114,324.4 146,318 178,311.6 210,302 242,286 274,279.6 306,270 338,254\"><\u002Fpolyline>\n<g fill=\"#A23B1E\"><circle cx=\"82\" cy=\"334\" r=\"5\"><\u002Fcircle><circle cx=\"114\" cy=\"324.4\" r=\"5\"><\u002Fcircle><circle cx=\"146\" cy=\"318\" r=\"5\"><\u002Fcircle><circle cx=\"178\" cy=\"311.6\" r=\"5\"><\u002Fcircle><circle cx=\"210\" cy=\"302\" r=\"5\"><\u002Fcircle><circle cx=\"242\" cy=\"286\" r=\"5\"><\u002Fcircle><circle cx=\"274\" cy=\"279.6\" r=\"5\"><\u002Fcircle><circle cx=\"306\" cy=\"270\" r=\"5\"><\u002Fcircle><circle cx=\"338\" cy=\"254\" r=\"5\"><\u002Fcircle><\u002Fg>\n<text x=\"300\" y=\"64\" font-size=\"14\" font-weight=\"600\" fill=\"#1B3F8B\" text-anchor=\"end\">AI Lab A<\u002Ftext>\n<text x=\"350\" y=\"240\" font-size=\"14\" font-weight=\"600\" fill=\"#A23B1E\" text-anchor=\"end\">Startup C<\u002Ftext>\n<\u002Fsvg>\n<\u002Ffigure>\n<\u002Fdiv>\n<p style=\"margin: 0; color: #333333\">On the line: honest. Below it: overconfident.<\u002Fp>\n\n<div style=\"border-top: 1.5px solid #111111; border-bottom: 1.5px solid #111111; margin-top: 12px\">\n<div style=\"padding: 10px 0; font-size: 14px; font-weight: 600; border-bottom: 0.75px solid #111111\">Leaderboard · net earnings<\u002Fdiv>\n<sc-for list=\"{{rows}}\" as=\"r\" hint-placeholder-count=\"4\">\n<div style=\"display: grid; grid-template-columns: 110px minmax(0, 1fr) minmax(0, 1fr) 64px; align-items: center; padding: 12px 0; border-bottom: 0.5px solid #D9D9D4\">\n<span style=\"font-weight: 600\">{{r.org}}<\u002Fspan>\n<div style=\"display: flex; justify-content: flex-end; height: 22px; border-right: 1px solid #111111\"><div style=\"{{r.neg}}\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; justify-content: flex-start; height: 22px\"><div style=\"{{r.pos}}\"><\u002Fdiv><\u002Fdiv>\n<span style=\"text-align: right; font-family: 'IBM Plex Mono', monospace; {{r.color}}\">{{r.net}}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<span style=\"font-size: 13px; color: #6B6B6B\">Illustrative numbers.<\u002Fspan>\n<\u002Fsection>\n\n<section style=\"display: flex; flex-direction: column; gap: 12px; border-top: 2px solid #111111; padding-top: 24px\">\n<h2 style=\"margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 28px; font-weight: 600\">Built today<\u002Fh2>\n<p style=\"margin: 0; color: #333333\">The full market running on DiscoverPhysics: 11 simulated physics worlds where the true answer is known, so every payout can be checked.<\u002Fp>\n<\u002Fsection>\n\n<\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:3400}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const mk = (org, v) => ({\n      org,\n      net: (v >= 0 ? '+' : '−') + '£' + Math.abs(v),\n      color: v >= 0 ? 'color: #1B3F8B' : 'color: #A23B1E',\n      pos: v > 0 ? 'height: 22px; background: #1B3F8B; width: ' + Math.round(v / 82 * 100) + '%' : 'width: 0',\n      neg: v < 0 ? 'height: 22px; background: #A23B1E; width: ' + Math.round(-v / 82 * 100) + '%' : 'width: 0'\n    });\n    const rows = [mk('AI Lab A', 82), mk('Startup A', 71), mk('Startup B', -36), mk('Startup C', -59)];\n    return { rows };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
