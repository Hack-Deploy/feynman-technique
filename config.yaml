# Discovery Market Configuration
# All numbers from the task specification; do not change.

simulation:
  ticks: 200
  seeds: [0, 1, 2, 3, 4]
  starting_credits: 100  # per agent

track_a:
  # Probability sources
  probability_sources: [raw, calibrated]
  # Cost model: rounds drawn uniform in [4, 16], 1 credit per round
  cost_per_round: 1
  rounds_min: 4
  rounds_max: 16
  expected_cost: 10  # (4+16)/2
  # Worlds: all 11 from Table 1
  worlds:
    - gravity
    - yukawa
    - hubble
    - ether
    - oscillator
    - coulomb
    - circle
    - extra_dimensions
    - fractional
    - dark_matter
    - three_species
  # Agents: all 4 from Table 1
  agents:
    - opus-4.7
    - gpt-5.5
    - sonnet-4.6
    - qwen3.5-397b
  # Prize sweeps
  baseline_prize: 20
  prize_sweep: [5, 20, 50, 100, 200]

track_c:
  # Cost model: fixed experiments per attempt * price per experiment
  experiments_per_attempt:
    mda: 8
    llm_opus: 8
    llm_opus_unthrottled: 41
  price_per_experiment_sweep: [0.25, 0.5, 1, 2]
  prize_sweep: [20, 50, 100]
  # Worlds: the 6 from Table 3
  worlds:
    - gravity
    - yukawa
    - coulomb
    - oscillator
    - fractional
    - extra_dimensions
  # Agents
  agents:
    - mda
    - llm_opus
    - llm_opus_unthrottled

# Belief prior: Beta distribution with weight 2 pseudo-attempts
belief_prior_weight: 2
